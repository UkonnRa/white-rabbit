[config]
default_to_workspace = false

# =============================================================================
# Prerequisites
# =============================================================================

[tasks.check-pipx]
script = '''
if ! command -v pipx > /dev/null 2>&1; then
    echo ""
    echo "ERROR: pipx is not installed."
    echo ""
    echo "Please install pipx first:"
    echo "  macOS:  brew install pipx && pipx ensurepath"
    echo "  Linux:  sudo apt install pipx && pipx ensurepath"
    echo "  pip:    python3 -m pip install --user pipx && python3 -m pipx ensurepath"
    echo ""
    echo "See https://github.com/pypa/pipx for details."
    exit 1
fi
'''

[tasks.check-pipx.windows]
script = '''
@echo off
where pipx >NUL 2>NUL
if %ERRORLEVEL% EQU 0 exit /b 0

echo.
echo ERROR: pipx is not installed.
echo.
echo Please install pipx first:
echo   Windows: py -m pip install --user pipx && py -m pipx ensurepath
echo   pip:     python -m pip install --user pipx && python -m pipx ensurepath
echo.
echo See https://github.com/pypa/pipx for details.
exit /b 1
'''

[tasks.install-commitizen]
dependencies = ["check-pipx"]
install_script = '''
if command -v cz > /dev/null 2>&1; then
    exit 0
fi
pipx install commitizen
'''

[tasks.install-commitizen.windows]
install_script = '''
@echo off
where cz >NUL 2>NUL
if %ERRORLEVEL% EQU 0 exit /b 0
pipx install commitizen
'''

[tasks.install-pre-commit]
dependencies = ["check-pipx"]
install_script = '''
if command -v pre-commit > /dev/null 2>&1; then
    exit 0
fi
pipx install pre-commit
'''

[tasks.install-pre-commit.windows]
install_script = '''
@echo off
where pre-commit >NUL 2>NUL
if %ERRORLEVEL% EQU 0 exit /b 0
pipx install pre-commit
'''

# =============================================================================
# Linting
# =============================================================================

[tasks.lint-fix-rustfmt]
toolchain = "nightly"
command = "cargo"
args = ["fmt"]

[tasks.lint-fix-clippy]
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged"]

[tasks.lint-fix-md]
install_crate = { crate_name = "rumdl", binary = "rumdl", test_arg = "--version" }
command = "rumdl"
args = ["check", "--fix", "docs/", "AGENTS.md"]

[tasks.lint-fix-cargo-sort]
install_crate = { crate_name = "cargo-sort", binary = "cargo-sort", test_arg = "--version" }
command = "cargo"
args = ["sort", "--workspace", "--grouped"]

[tasks.lint-fix]
run_task = [
    { name = ["lint-fix-cargo-sort", "lint-fix-rustfmt", "lint-fix-clippy", "lint-fix-md"] },
]

# =============================================================================
# Tauri
# =============================================================================

[tasks.tauri]
install_crate = { crate_name = "tauri-cli", binary = "cargo-tauri", test_arg = "--version" }
command = "cargo"
args = ["tauri", "${@}"]

# =============================================================================
# Commit
# =============================================================================

[tasks.cz]
dependencies = ["install-commitizen"]
command = "cz"
args = ["commit"]

# =============================================================================
# Dependency Management
# =============================================================================

[tasks.upgrade-1]
command = "cargo"
args = ["update"]

[tasks.upgrade-2]
install_crate = { crate_name = "cargo-edit", binary = "cargo-upgrade", test_arg = "--help" }
command = "cargo"
args = ["upgrade", "--incompatible", "--pinned"]

[tasks.upgrade-yarn]
script = "yarn upgrade-interactive"

[tasks.upgrade-pipx]
dependencies = ["check-pipx", "install-commitizen", "install-pre-commit"]
script = '''
pipx upgrade commitizen || true
pipx upgrade pre-commit || true
'''

[tasks.upgrade]
run_task = [
    { name = ["upgrade-1", "upgrade-2", "upgrade-yarn", "upgrade-pipx"] },
]
