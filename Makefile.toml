[config]
default_to_workspace = false

[tasks.lint-fix-rustfmt]
toolchain = "nightly"
command = "cargo"
args = ["fmt"]

[tasks.lint-fix-clippy]
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged"]

[tasks.lint-fix-md]
install_crate = { crate_name = "rumdl", binary = "rumdl", test_arg = "--version" }
command = "rumdl"
args = ["check", "--fix", "docs/", "AGENTS.md"]

[tasks.lint-fix]
run_task = [
    { name = ["lint-fix-rustfmt", "lint-fix-clippy", "lint-fix-md"] },
]

[tasks.commit]
install_script = '''
if command -v cz &> /dev/null; then
    exit 0
fi
if command -v pipx &> /dev/null; then
    pipx install commitizen
elif command -v uv &> /dev/null; then
    uv tool install commitizen
elif command -v pip3 &> /dev/null; then
    pip3 install --user commitizen
else
    pip install --user commitizen
fi
'''
command = "cz"
args = ["commit"]

[tasks.upgrade-1]
command = "cargo"
args = ["update"]

[tasks.upgrade-2]
install_crate = { crate_name = "cargo-edit", binary = "cargo-upgrade", test_arg = "--help" }
command = "cargo"
args = ["upgrade", "--incompatible", "--pinned"]

[tasks.upgrade]
run_task = [
    { name = ["upgrade-1", "upgrade-2"] },
]