[workspace]
resolver = "3"
members = ["crates/*"]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ukonn Ra <ukonnra@outlook.com>"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["rc", "derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
uuid = { version = "1.21", features = ["v7"] }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
rust_decimal = { version = "1.40", features = ["serde-str", "macros"] }
strum = { version = "0.28", features = ["derive"] }
itertools = "0.14"
sea-orm = { version = "2.0.0-rc.34", features = ["runtime-tokio", "macros", "with-chrono", "with-json", "with-rust_decimal", "with-uuid"] }
sea-orm-migration = { version = "2.0.0-rc.34", features = ["runtime-tokio"] }
