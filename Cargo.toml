[workspace]
resolver = "3"
members = ["crates/*"]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ukonn Ra <ukonnra@outlook.com>"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["rc", "derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
